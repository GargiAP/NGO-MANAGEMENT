<!-- templates/navbar.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navbar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='login_modal.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">
  <style>
    .user-section {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-initials {
  width: 40px;
  height: 40px;
  background-color: transparent;
  border: 1px solid white;
  color: white;
  font-weight: bold;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.logout-btn {
  padding: 8px 16px;
  border: 1px solid white;
  background-color: transparent;
  color: white;
  border-radius: 25px;
  cursor: pointer;
  font-size: 14px;
}

.logout-btn:hover {
  background-color: white;
  color: #333;
}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <img src="{{ url_for('static', filename='logo.ico') }}" alt="Logo" />
    </div>

    <ul class="nav-links">
      <li><a href="{{ url_for('home') }}">Home</a></li>
      <li><a href="{{ url_for('volunteer') }}">Volunteer</a></li>
      <li><a href="{{ url_for('donation') }}">Donation</a></li>
    </ul>

    <div class="button-container">
      {% if initials %}
        <div class="user-section">
          <div class="user-initials">{{ initials }}</div>
          <form action="{{ url_for('logout') }}" method="post">
            <button type="submit" class="logout-btn">Logout</button>
          </form>
        </div>
      {% else %}
        <button id="openLoginModal" class="button login-btn">Login</button>
        <button id="openSignupModal" class="button signup-btn">Sign Up</button>
      {% endif %}
    </div>
    
    
  </nav>
</body>
</html>
