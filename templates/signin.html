<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volunteer Sign Up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='signin.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <div class="signin-container">
    <div class="signin-card">
      <!-- Close Button -->
      <a href="/" class="popup-close">×</a>

      <h2>Sign Up</h2>

      <form id="signupForm" action="{{ url_for('signup_volunteer') }}" method="POST">

        <div class="input-container">
          <i class="fa fa-user icon"></i>
          <input type="text" name="username" placeholder="Username" required />
        </div>

        <div class="input-container">
          <i class="fa fa-envelope icon"></i>
          <input type="email" name="email" placeholder="Email ID" required />
        </div>

        <div class="row">
          <div class="input-container">
            <i class="fa fa-calendar icon"></i>
            <input type="number" name="age" placeholder="Age" required />
          </div>
          <div class="input-container">
            <i class="fa fa-phone icon"></i>
            <input type="tel" name="contact_no" placeholder="Contact No." required />
          </div>
        </div>

        <div class="row">
          <div class="input-container">
            <i class="fa fa-venus-mars icon"></i>
            <input type="text" name="gender" placeholder="Gender" required />
          </div>
          <div class="input-container">
            <i class="fa fa-map-marker-alt icon"></i>
            <input type="text" name="address" placeholder="Address" required />
          </div>
        </div>

        <div class="row">
          <div class="input-container">
            <i class="fa fa-lock icon"></i>
            <input type="password" name="password" id="password" placeholder="Set Password" required />
          </div>
          <div class="input-container">
            <i class="fa fa-lock icon"></i>
            <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required />
          </div>
        </div>

        <button type="submit" class="signup-button">Sign Up</button>

      </form>

    </div>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function (e) {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;

      if (password !== confirmPassword) {
        e.preventDefault(); // stop form from submitting
        alert("Passwords do not match. Please try again.");
      }
    });
  </script>

</body>
</html>
