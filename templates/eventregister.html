<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Register</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='volunteerform.css') }}" />
</head>
<body>

  <!-- Flash Message Display -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="volunteer-wrapper">
    <div class="volunteer-card">
      <h2>Event Register</h2>

      <form action="{{ url_for('register_event') }}" method="POST">
        <div class="input-container">
          <i class="fas fa-user icon"></i>
          <input type="text" name="ngo_name" placeholder="NGO Name" required />
        </div>

        <div class="input-container">
          <i class="fas fa-envelope icon"></i>
          <input type="text" name="description" placeholder="Description" required />
        </div>

        <div class="row">
          <div class="input-container">
            <i class="fas fa-map-marked-alt icon"></i>
            <input type="text" name="venue" placeholder="Venue" required />
          </div>
          <div class="input-container">
            <i class="fas fa-phone icon"></i>
            <input type="tel" name="contact_no" placeholder="Contact No." required />
          </div>
        </div>

        <div class="row">
          <div class="input-container">
            <i class="fas fa-calendar-alt icon"></i>
            <input type="date" name="event_date" required />
          </div>
          <div class="input-container">
            <i class="fas fa-clock icon"></i>
            <input type="time" name="event_time" required />
          </div>
        </div>

        <button type="submit" class="volunteer-button">Register</button>
      </form>

    </div>
  </div>

</body>
</html>
