<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NGO Sign Up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='signin.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="signin-container">
    <div class="signin-card">
      <a href="/" class="popup-close">×</a>

      <h2>NGO Sign Up</h2>

      <form id="ngoSignupForm" action="{{ url_for('register_ngo') }}" method="POST">

        <div class="input-container">
          <i class="fa fa-user icon"></i>
          <input type="text" name="ngo_name" placeholder="NGO Name" required />
        </div>

        <div class="input-container">
          <i class="fa fa-envelope icon"></i>
          <input type="email" name="email" placeholder="Email ID" required />
        </div>

        <div class="row">
          <div class="input-container">
            <i class="fa fa-phone icon"></i>
            <input type="tel" name="contact_no" placeholder="Contact No." required />
          </div>

          <div class="input-container">
            <i class="fa fa-map-marker-alt icon"></i>
            <input type="text" name="address" placeholder="Address" required />
          </div>
        </div>

        <div class="row">
          <div class="input-container">
            <i class="fa fa-lock icon"></i>
            <input type="password" id="ngo_password" name="password" placeholder="Set Password" required />
          </div>

          <div class="input-container">
            <i class="fa fa-lock icon"></i>
            <input type="password" id="ngo_confirm_password" name="confirm_password" placeholder="Confirm Password" required />
          </div>
        </div>

        <button type="submit" class="signup-button">Sign Up</button>

      </form>
    </div>
  </div>

  <script>
    document.getElementById("ngoSignupForm").addEventListener("submit", function (e) {
      const password = document.getElementById("ngo_password").value;
      const confirmPassword = document.getElementById("ngo_confirm_password").value;

      if (password !== confirmPassword) {
        e.preventDefault(); // Stop form submission
        alert("Passwords do not match. Please try again.");
      }
    });
  </script>
</body>
</html>
